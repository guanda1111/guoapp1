name: Build Windows
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 设置国内Pub镜像
        run: |
          echo "PUB_HOSTED_URL=https://pub.flutter-io.cn" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "FLUTTER_STORAGE_BASE_URL=https://storage.flutter-io.cn" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: 安装 Flutter 3.44.0
        uses: subosito/flutter-action@v2.10.0
        with:
          flutter-version: '3.44.0'
          channel: stable

      - name: 缓存pub依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            **/build
          key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.yaml') }}

      - name: flutter pub get
        run: flutter pub get

      - name: 编译Windows Release，跳过INSTALL阶段（关键修复）
        run: flutter build windows --release --no-install

      - name: 收集Release产物
        run: |
          mkdir -p build/windows-x64-release
          Copy-Item -Recurse build/windows/x64/Release/* build/windows-x64-release/

      - name: 上传打包产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-duanju
          path: build/windows-x64-release/
